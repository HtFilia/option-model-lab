[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "option-model-lab-backend"
version = "0.1.0"
description = "Stateless quantitative API for Option Model Lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
